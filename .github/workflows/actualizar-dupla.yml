name: Actualizar histórico Dupla

on:
  workflow_dispatch:

  schedule:
  - cron: "0 11 * * *"
  - cron: "0 21 * * *"
  
permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      # Descargar repositorio
      - name: Descargar repositorio
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      # Preparar Python
      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Instalar dependencias
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Ejecutar importación y actualización
      - name: Actualizar histórico
        run: python actualizar_historico.py

      # Guardar resultados aunque la importación sea parcial
      - name: Guardar cambios
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- data/

          if ! git diff --cached --quiet; then
            git commit -m "Actualizar histórico Dupla"
            git push
          else
            echo "No hay cambios que guardar."
          fi
          
